name = "knoellchenfrei-api"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Free tier: 100k requests/day, 10ms CPU per request. This worker does one
# upstream fetch on a cache miss and cheap JSON work otherwise, so the ceiling
# is requests, not CPU.

[[kv_namespaces]]
binding = "CACHE"
id = "f9e9b42d68b64db79027cb29e9da509a"

[[d1_databases]]
binding = "DB"
database_name = "knoellchenfrei"
database_id = "733e1c3b-b8f2-429f-8503-7e703e3ec6a4"
# D1 bringt ein Migrationswerkzeug mit: `wrangler d1 migrations apply` führt
# eine Tabelle `d1_migrations` mit und überspringt, was schon eingespielt ist.
# Vorher stand hier ein selbstgebautes Gegenstück, das den Zustand aus
# Fehlermeldungen erriet — und einmal danebenlag.
migrations_dir = "migrations"

# Stündlich: ablaufende Sichtungen ernten und löschen, damit die Tabelle nie
# ein Bewegungsprotokoll wird. Täglich um 03:37 UTC: das Modell der
# Langzeitmuster (`src/patterns.ts`) — nicht stündlich, weil es bei drei
# Jahren Daten das Lesebudget von D1 sprengte. `scheduled` verzweigt über
# `event.cron`; der Ausdruck steht als `DAILY_CRON` in worker.ts.
[triggers]
crons = ["7 * * * *", "37 3 * * *"]

[observability]
enabled = true

[vars]
# Comma-separated. Unset means same-origin only — the worker fails closed
# rather than defaulting to a wildcard.
#
# Abgeglichen wird der `Origin`-Kopf **wörtlich**, nicht als Muster. Das hat
# zwei Folgen, die man kennen muss:
#
# 1. Die Vorschau-Adressen von Cloudflare Pages (`<hash>.knoellchenfrei.pages.dev`)
#    stehen hier bewusst **nicht** drin. Sie ändern sich bei jedem Deploy und
#    ließen sich nur mit einem Platzhalter erfassen — dann stünde die API aber
#    jeder Vorschau offen, auch einer aus einem fremden Fork. Wer eine Vorschau
#    gegen den echten Worker testen will, trägt ihre Adresse hier für die Dauer
#    des Tests ein.
# 2. Die eigenen Domains stehen schon drin, obwohl sie noch nicht ausliefern.
#    Das ist folgenlos: Auf einer Adresse antworten kann nur, wer sie
#    kontrolliert. Es erspart die Änderung an dem Tag, an dem die DNS umzieht.
#
# `knoellchenfrei.github.io` fehlt mit Absicht: Die Pages-Fassung wird ohne
# `VITE_API_BASE` gebaut und spricht den Worker gar nicht an.
ALLOWED_ORIGINS = "https://knoellchenfrei.pages.dev,https://knoellchenfrei.de,https://www.knoellchenfrei.de"

