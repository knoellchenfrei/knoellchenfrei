name = "parkingzone-api"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Free tier: 100k requests/day, 10ms CPU per request. This worker does one
# upstream fetch on a cache miss and cheap JSON work otherwise, so the ceiling
# is requests, not CPU.

[[kv_namespaces]]
binding = "CACHE"
id = "5206119c869e4f84b80225963838bb5c"

[[d1_databases]]
binding = "DB"
database_name = "parkingzone"
database_id = "b9d6c579-66d6-4a05-9899-859fa08ad93c"

# Purges expired sightings hourly so the table never becomes a movement history.
[triggers]
crons = ["7 * * * *"]

[observability]
enabled = true

[vars]
# Comma-separated. Unset means same-origin only — the worker fails closed
# rather than defaulting to a wildcard.
ALLOWED_ORIGINS = ""

