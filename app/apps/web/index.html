<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="Berliner Parkzonen: gilt hier gerade Gebührenpflicht, was kostet es, wie lange darf ich stehen." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Apple liest das Manifest bis heute nur zum Teil: Symbol, Titel und
      Statusleiste der abgelegten App kommen von hier, nicht von dort.
      `black-translucent` lässt die Karte bis unter die Uhr laufen; die
      Kopfzeile hält mit `env(safe-area-inset-top)` Abstand.
    -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ParkingZone" />
    <title>ParkingZone Berlin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
