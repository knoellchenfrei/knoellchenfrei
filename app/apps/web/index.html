<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!--
      `interactive-widget=resizes-content`: Seit Chrome 108 verkleinert die
      Bildschirmtastatur auf Android sonst nur den sichtbaren Ausschnitt, nicht
      die Seite. Der Fuß eines Blatts mit dem Absenden-Knopf lag damit hinter
      der Tastatur. Mit dieser Angabe schrumpft die Seite, und der Fuß rückt
      über die Tastatur. Das iPhone kennt die Angabe nicht; dort übernimmt
      `src/viewport.ts` dieselbe Aufgabe über `visualViewport`.
    -->
    <!--
      `maximum-scale=1, user-scalable=no`: Die Seite selbst zoomt nicht, nur die
      Karte — sie hat ihren eigenen Zoom. Bis zum 9. September liess sich auf
      dem iPhone das Blatt, die Kopfzeile und die Chip-Zeile aufziehen, und
      der Zustand blieb; die Bedienung war danach kaputt (Betreiber). Der
      Preis ist bekannt: Wer grössere Schrift braucht, bekommt sie über die
      Systemeinstellung, nicht über Aufziehen. In der abgelegten App gilt die
      Angabe, in Safari hilft `touch-action` in styles.css nach.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="Parkzonen in Berlin, Hamburg, Frankfurt am Main, München, Köln, Düsseldorf und Karlsruhe: gilt hier gerade Gebührenpflicht, was kostet es, wie lange darf ich stehen." />
    <!-- Die Vorschaukarte für geteilte Links. Dieselben Angaben trägt die
         Anmeldeseite (functions/login-page.ts) — die sehen die Bots, solange
         der Riegel steht; diese hier gelten, sobald die App öffentlich ist. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="knoellchenfrei" />
    <meta property="og:title" content="knoellchenfrei — kostet Parken hier gerade?" />
    <meta property="og:description" content="Parkzonen in Berlin, Hamburg, Frankfurt, München, Köln, Düsseldorf und Karlsruhe: Gebührenpflicht, Preis, Höchstparkdauer — und ob das Ordnungsamt unterwegs ist. Aus amtlichen Daten, offener Quelltext." />
    <meta property="og:url" content="https://knoellchenfrei.de/" />
    <meta property="og:image" content="https://knoellchenfrei.de/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="knoellchenfrei — was Parken hier gerade kostet, und ob das Ordnungsamt unterwegs ist" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="knoellchenfrei — kostet Parken hier gerade?" />
    <meta name="twitter:image" content="https://knoellchenfrei.de/og.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Apple liest das Manifest bis heute nur zum Teil: Symbol, Titel und
      Statusleiste der abgelegten App kommen von hier, nicht von dort.
      `black-translucent` lässt die Karte bis unter die Uhr laufen; die
      Kopfzeile hält mit `env(safe-area-inset-top)` Abstand.
    -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="knoellchenfrei" />
    <title>knoellchenfrei</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
