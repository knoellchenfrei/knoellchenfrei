packages:
  - 'packages/*'
  - 'apps/*'

# Hebt pnpms `minimumReleaseAge` auf — für alle Pakete.
#
# Wir setzen `minimumReleaseAge` selbst **nicht**. Ohne die Einstellung ist
# diese Ausnahmeliste wirkungslos, für `pnpm install` hier und in der CI ändert
# sich also nichts. Sie steht für einen einzigen Fall: **Dependabot**.
#
# Dependabot übersetzt seinen `cooldown` in `--config.minimumReleaseAge` und
# legt ihn über den ganzen Auflösungslauf — auch dann, wenn in der
# `dependabot.yml` gar kein Cooldown steht, denn seit Mitte 2026 gelten drei
# Tage als Voreinstellung. pnpm prüft das Alter aber erst **nach** dem
# Auflösen und fällt nicht auf eine ältere passende Version zurück, sondern
# bricht ab. Ein einziges zu junges Paket im Baum lässt damit jedes Update
# scheitern:
#
#   ERR_PNPM_NO_MATURE_MATCHING_VERSION  Version 1.63.0 (released 42 hours
#   ago) of @playwright/test does not meet the minimumReleaseAge constraint
#
# So sind am 6. September alle sechs Hauptversions-Updates ausgefallen.
# Bekannter offener Konflikt: `dependabot-core#13165`, `pnpm#11203`.
#
# Warum der Stern und nicht eine Liste: nachgemessen. Mit einem künstlichen
# Fenster von 90 Tagen scheiterte der Lauf zuerst an `typescript`; nach dessen
# Ausnahme scheiterte er an `@typescript/typescript-linux-ppc64` — einer
# transitiven Abhängigkeit, die niemand von Hand pflegt. Eine Namensliste ist
# hier Sisyphosarbeit, der Stern nicht.
#
# Was das **nicht** kostet: Dependabots eigene Wartezeit bleibt wirksam. Sie
# entscheidet serverseitig, *welche* Version überhaupt vorgeschlagen wird;
# pnpm schreibt danach nur noch das Lockfile. Aufgehoben wird also nur die
# Nebenwirkung auf den restlichen Baum, nicht der Schutz.
#
# Wiedervorlage: pnpm 11 kennt `minimumReleaseAgeStrict: false` — genau den
# Rückfall, der hier fehlt. pnpm 10.33 kennt ihn nicht (`pnpm config get`
# liefert `undefined`). Mit dem Sprung auf 11 gehört diese Zeile geprüft.
minimumReleaseAgeExclude:
  - '*'

# Was beim ersten `pnpm install` als Warnung erscheint — und warum es so
# bleibt.
#
# pnpm 10 führt Installations-Skripte von Abhängigkeiten **nicht** aus, solange
# sie nicht ausdrücklich freigegeben sind. Der frische Klon meldet deshalb
# „Ignored build scripts: esbuild, workerd. Run `pnpm approve-builds` to pick
# which dependencies should be allowed to run scripts." Das sieht nach einem
# halben Install aus und ist keiner: Beide Pakete laden in ihrem Skript nur ihr
# passendes Binary herunter, und beide finden es auch ohne — `esbuild` über
# seine plattformspezifischen Unterpakete, `workerd` genauso. Gemessen: Build,
# Tests und `wrangler dev` laufen.
#
# Eintragen statt freigeben ist die Entscheidung: Ein Installations-Skript ist
# der bequemste Weg, über eine kompromittierte Abhängigkeit Code auf dem
# Entwicklerrechner auszuführen. Solange nichts fehlt, bleibt es aus (der
# Audit-Punkt dazu ist M-099, „nirgends erklärt" — nicht „falsch").
ignoredBuiltDependencies:
  - esbuild
  - workerd

# Erzwingt eine Fassung von `sharp`, die nicht verwundbar ist.
#
# `sharp` steht in keiner unserer package.json — es kommt transitiv ueber
# `miniflare` und damit ueber `wrangler`, also ueber ein reines Werkzeug, das
# nie ausgeliefert wird. Trotzdem meldet GitHub dafuer eine **hohe**
# Schwachstelle (GHSA-g89c-p67h-r497 und GHSA-2jg2-4, Luecken in libheif), und
# `pnpm audit --audit-level moderate` bricht in der CI ab -- zu Recht: Ein
# Werkzeug laeuft auf dem Rechner des Betreibers und in der CI, und beide
# haben Zugriff auf mehr als die App.
#
# Warten, bis wrangler nachzieht, hiesse: die Pruefung so lange rot lassen oder
# stummschalten. Beides ist schlechter als eine Zeile, die die reparierte
# Fassung erzwingt. Sie ist rein additiv -- 0.35.4 ist ein Patch auf 0.35.2.
#
# Wiedervorlage: Sobald miniflare selbst >= 0.35.4 verlangt, gehoert diese
# Zeile geprueft und entfernt. Ein Override, den niemand mehr braucht, verdeckt
# beim naechsten Mal ein echtes Problem.
overrides:
  sharp: '>=0.35.4'
