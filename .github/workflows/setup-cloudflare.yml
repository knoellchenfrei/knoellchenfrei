# Einmalige Cloudflare-Einrichtung, ohne Terminal.
#
# Legt KV-Namespace und D1-Datenbank an, trägt die IDs in wrangler.toml ein,
# committet das zurück und spielt das Schema ein. Danach übernimmt deploy.yml.
#
# Absichtlich von Hand auszulösen (Actions -> "Cloudflare einrichten" -> Run
# workflow): Es ist ein Schritt, der Ressourcen in einem fremden Konto erzeugt,
# und der gehört nicht an einen Push gekoppelt.
#
# Zweimal starten ist ungefährlich: Existiert eine Ressource schon, wird sie
# nicht neu angelegt, und das Schema besteht ausschließlich aus
# CREATE TABLE IF NOT EXISTS.
name: Cloudflare einrichten

on:
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'D1-Jurisdiktion (eu bindet die Daten an die EU; leer lassen für keine Bindung)'
        default: 'eu'
        required: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Zugangsdaten prüfen
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Secrets:$missing — anzulegen unter Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Abhängigkeiten
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Die Ausgabe der beiden create-Befehle wird vollständig ins Log
      # geschrieben, bevor irgendetwas geparst wird. Wenn das Parsen scheitert,
      # steht die ID trotzdem lesbar da und lässt sich von Hand eintragen —
      # das ist der Unterschied zwischen "geht nicht" und "geht nicht, hier ist
      # warum".
      - name: KV-Namespace anlegen
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler kv namespace create CACHE 2>&1 | tee kv.log || true
          echo "--- Ausgabe oben, Auswertung unten ---"
          id=$(grep -oE '[0-9a-f]{32}' kv.log | head -1 || true)
          if [ -z "$id" ]; then
            id=$(npx wrangler kv namespace list 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);const m=l.find(n=>/CACHE/.test(n.title));if(m)console.log(m.id)}catch{}})' || true)
            [ -n "$id" ] && echo "Bestehenden Namespace wiederverwendet."
          fi
          if [ -z "$id" ]; then
            echo "::error::Keine KV-Namespace-ID gefunden. Die Ausgabe oben zeigt, woran es lag."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "KV-Namespace: $id"

      - name: D1-Datenbank anlegen
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JURISDICTION: ${{ inputs.jurisdiction }}
        run: |
          set -o pipefail
          args=""
          [ -n "$JURISDICTION" ] && args="--jurisdiction $JURISDICTION"
          # shellcheck disable=SC2086
          npx wrangler d1 create parkingzone $args 2>&1 | tee d1.log || true
          echo "--- Ausgabe oben, Auswertung unten ---"
          id=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' d1.log | head -1 || true)
          if [ -z "$id" ]; then
            id=$(npx wrangler d1 list --json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);const m=l.find(n=>n.name==="parkingzone");if(m)console.log(m.uuid||m.database_id)}catch{}})' || true)
            [ -n "$id" ] && echo "Bestehende Datenbank wiederverwendet."
          fi
          if [ -z "$id" ]; then
            echo "::error::Keine D1-ID gefunden. Die Ausgabe oben zeigt, woran es lag."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "D1-Datenbank: $id"

      - name: IDs in wrangler.toml eintragen
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
          D1_ID: ${{ steps.d1.outputs.id }}
        run: |
          sed -i "s|REPLACE_WITH_KV_ID|$KV_ID|; s|REPLACE_WITH_D1_ID|$D1_ID|" wrangler.toml
          grep -n 'id = ' wrangler.toml

      - name: Schema einspielen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute parkingzone --file=schema.sql --remote --yes

      - name: Änderung committen
        run: |
          if git diff --quiet -- wrangler.toml; then
            echo "wrangler.toml war schon eingetragen — nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          # Zwei -m statt einer mehrzeiligen Zeichenkette: eine solche bricht im
          # YAML-Block-Skalar aus der Einrückung aus und macht die Datei ungültig.
          git commit \
            -m "Cloudflare-IDs eintragen" \
            -m "Erzeugt vom Workflow 'Cloudflare einrichten'. KV- und D1-IDs sind keine Geheimnisse: ohne den API-Token ist damit nichts anzufangen, und wrangler braucht sie im Klartext."
          git push

      - name: Nächster Schritt
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
          D1_ID: ${{ steps.d1.outputs.id }}
        run: |
          {
            echo "### Cloudflare steht"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| KV-Namespace | \`$KV_ID\` |"
            echo "| D1-Datenbank | \`$D1_ID\` |"
            echo
            echo "Jetzt fehlt nur noch **ein** Secret, danach rollt jeder Push aus:"
            echo
            echo '- `VITE_API_BASE` — die Worker-Adresse, sichtbar in der Ausgabe des nächsten Deploy-Laufs'
            echo
            echo "Ohne diesen Wert läuft die App im lokalen Modus: Meldungen bleiben auf dem Gerät."
            echo
            echo 'Danach unter *Actions → Deploy → Run workflow* starten.'
          } >> "$GITHUB_STEP_SUMMARY"
