# Prüft, dass jede Datei unter .github gültiges YAML ist.
#
# Eine kaputte Workflow-Datei fällt sonst erst auf, wenn GitHub sie ignoriert —
# und "der Workflow läuft nicht" ist ein deutlich schlechteres Signal als ein
# roter Haken mit Zeilennummer. Genau das ist hier einmal passiert.
#
# `dependabot.yml` steht aus demselben Grund mit drin: GitHub ignoriert auch
# sie stillschweigend, wenn sie nicht parst. Der Unterschied ist nur, dass dann
# nichts rot wird, sondern schlicht nie ein Update-PR kommt — und darauf zu
# warten, dass etwas nicht passiert, merkt niemand.
name: Workflows prüfen

on:
  push:
    paths: ['.github/**.yml']
  pull_request:
    paths: ['.github/**.yml']

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML parsen
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          files = sorted(pathlib.Path('.github/workflows').glob('*.yml'))
          dependabot = pathlib.Path('.github/dependabot.yml')
          if dependabot.exists():
              files.append(dependabot)
          for path in files:
              try:
                  yaml.safe_load(path.read_text())
                  print(f'ok   {path}')
              except yaml.YAMLError as error:
                  bad.append(f'{path}: {error}')
                  print(f'FAIL {path}\n{error}')
          sys.exit(1 if bad else 0)
          PY
