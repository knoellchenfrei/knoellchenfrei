# Prüft, dass jede Workflow-Datei gültiges YAML ist.
#
# Eine kaputte Workflow-Datei fällt sonst erst auf, wenn GitHub sie ignoriert —
# und "der Workflow läuft nicht" ist ein deutlich schlechteres Signal als ein
# roter Haken mit Zeilennummer. Genau das ist hier einmal passiert.
name: Workflows prüfen

on:
  push:
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML parsen
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text())
                  print(f'ok   {path}')
              except yaml.YAMLError as error:
                  bad.append(f'{path}: {error}')
                  print(f'FAIL {path}\n{error}')
          sys.exit(1 if bad else 0)
          PY
