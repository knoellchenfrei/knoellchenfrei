# Prüft, dass jede YAML-Datei unter .github gültiges YAML ist —
# Workflows, `dependabot.yml` und die Issue-Formulare.
#
# Eine kaputte Workflow-Datei fällt sonst erst auf, wenn GitHub sie ignoriert —
# und "der Workflow läuft nicht" ist ein deutlich schlechteres Signal als ein
# roter Haken mit Zeilennummer. Genau das ist hier einmal passiert.
#
# `dependabot.yml` steht aus demselben Grund mit drin: GitHub ignoriert auch
# sie stillschweigend, wenn sie nicht parst. Der Unterschied ist nur, dass dann
# nichts rot wird, sondern schlicht nie ein Update-PR kommt — und darauf zu
# warten, dass etwas nicht passiert, merkt niemand.
name: Workflows prüfen

on:
  push:
    paths: ['.github/**.yml', '.github/**.yaml']
  pull_request:
    paths: ['.github/**.yml', '.github/**.yaml']

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: YAML parsen
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          # Alles unter .github, nicht nur die Workflows: Der Auslöser oben
          # heisst `.github/**.yml`, geprüft wurden aber nur `workflows/*.yml`
          # und `dependabot.yml`. Die Issue-Formulare unter ISSUE_TEMPLATE/
          # blieben damit ungeprüft und der Lauf trotzdem grün — GitHub
          # ignoriert ein kaputtes Formular stillschweigend, und dann fehlt
          # schlicht die Vorlage (Audit-Punkt M-070).
          root = pathlib.Path('.github')
          files = sorted(set(root.rglob('*.yml')) | set(root.rglob('*.yaml')))
          if not files:
              print('Keine YAML-Datei unter .github gefunden — das ist selbst ein Fehler.')
              sys.exit(1)
          for path in files:
              try:
                  yaml.safe_load(path.read_text())
                  print(f'ok   {path}')
              except yaml.YAMLError as error:
                  bad.append(f'{path}: {error}')
                  print(f'FAIL {path}\n{error}')

          # Gültiges YAML reicht nicht: GitHub wertet die Ausdruck-Klammern an **jeder**
          # Stelle der Datei aus, auch in einem Kommentar innerhalb eines
          # `run:`-Blocks. Ein leerer Ausdruck ist dort ein Syntaxfehler, und
          # der Lauf scheitert nach null Sekunden mit „This run likely failed
          # because of a workflow file issue" — ohne Zeilennummer, ohne Log,
          # ohne Job. Genau das ist am 7. September passiert: In einem
          # Kommentar stand die leere Form als Beispiel.
          import re
          leer = re.compile(r'\$\{\{\s*\}\}')
          for path in files:
              for nummer, zeile in enumerate(path.read_text().splitlines(), 1):
                  if leer.search(zeile):
                      bad.append(f'{path}:{nummer}: leerer Ausdruck')
                      print(f'FAIL {path}:{nummer}: leerer Ausdruck — GitHub wertet die Klammern aus, auch im Kommentar')
          sys.exit(1 if bad else 0)
          PY
