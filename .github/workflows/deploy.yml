# Rollt Worker und Web-App aus, sobald die Zugangsdaten im Repository liegen.
#
# Der Workflow ist absichtlich so gebaut, dass er OHNE eingerichtetes
# Cloudflare-Konto sauber durchläuft und die Schritte überspringt, statt rot zu
# werden: ein Fork oder ein Pull Request soll nicht an fehlenden Secrets
# scheitern. Was fehlt, sagt der Zusammenfassungsschritt am Ende.
name: Deploy

on:
  push:
    branches: [main]
  # Der tägliche Abzug der Behördendaten. Er stand bis zum 7. September in
  # `pages.yml` und ging mit GitHub Pages ausser Betrieb — dort war er ohnehin
  # halb wirkungslos: Er frischte nur die Kopie auf GitHub Pages auf, während
  # Cloudflare Pages weiter den eingecheckten Stand auslieferte. Jetzt hängt er
  # an dem Deploy, der die App wirklich ausliefert. Dass dabei auch der Worker
  # neu ausgerollt wird, ist folgenlos: Derselbe Stand ergibt dieselbe Version.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Abhängigkeiten
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Ohne diesen Schritt ginge eine kaputte Version live; die Prüfungen
      # laufen in ci.yml zwar auch, aber nicht zwingend vor diesem Workflow.
      - name: Prüfen
        working-directory: app
        run: pnpm typecheck && pnpm test

      - name: Fehlende Zugangsdaten feststellen
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Ohne diesen Halt liefe der Deploy gegen `REPLACE_WITH_KV_ID` und
      # scheiterte mit einer Meldung über eine unbekannte Kennung — was nach
      # einem Fehler im Konto aussieht und keiner ist. Der Hinweis nennt den
      # Workflow, der fehlt.
      - name: Ist Cloudflare eingerichtet?
        if: steps.gate.outputs.ready == 'true'
        working-directory: app/apps/api
        run: |
          if grep -q 'REPLACE_WITH_' wrangler.toml; then
            echo "::error::wrangler.toml trägt noch Platzhalter. Die Einrichtung läuft nicht hier, sondern von deinem Rechner: ./scripts/einrichten.sh -- sie legt KV, D1, Migrationen und das Pages-Projekt an und committet die Kennungen zurück."
            exit 1
          fi
          echo "KV und D1 sind eingetragen."

      # **Migrationen vor dem Worker, nicht danach.**
      #
      # Bis zum 7. September rollte der Deploy Code aus und liess das Schema
      # liegen: Eine neue Migration im Repository wurde nie angewendet, und der
      # Worker traf auf eine Tabelle, die es nicht gab. Das fällt erst zur
      # Laufzeit auf, im Log, bei der ersten Anfrage — die schlechteste Stelle.
      #
      # `wrangler d1 migrations apply` führt selbst Buch (`d1_migrations`) und
      # überspringt, was schon eingespielt ist. Der Schritt ist damit auf einem
      # aktuellen Stand folgenlos.
      #
      # `continue-on-error`, weil der Deploy-Token absichtlich eng ist: Ohne
      # `D1:Edit` scheitert der Schritt, und dann soll trotzdem ausgerollt
      # werden — nur eben mit einem gelben Haken und dem Satz darunter, statt
      # mit einem stillen Überspringen.
      - name: D1-Migrationen anwenden
        id: migrationen
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/apps/api
          command: d1 migrations apply knoellchenfrei --remote

      - name: Sagen, wenn das Schema nicht mitgezogen ist
        if: steps.migrationen.outcome == 'failure'
        run: |
          echo "::warning::D1-Migrationen konnten nicht angewendet werden — fehlt dem Token 'D1:Edit'? Der Worker läuft dann gegen ein älteres Schema. Von Hand: cd app/apps/api && pnpm --filter @knoellchenfrei/api exec wrangler d1 migrations apply knoellchenfrei --remote"

      - name: Worker ausrollen
        id: worker
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/apps/api

      # Die Adresse des Workers steht nach dem Deploy fest — sie von Hand in ein
      # Secret zu tippen war ein Arbeitsschritt ohne Erkenntnisgewinn und eine
      # Fehlerquelle dazu. `deployment-url` liefert sie; das Secret bleibt als
      # Vorrang bestehen, falls der Worker je hinter einer eigenen Domain liegt.
      - name: Adresse des Workers bestimmen
        id: api
        if: steps.gate.outputs.ready == 'true'
        env:
          AUS_SECRET: ${{ secrets.VITE_API_BASE }}
          AUS_DEPLOY: ${{ steps.worker.outputs.deployment-url }}
        run: |
          basis="$AUS_SECRET"
          quelle="Secret VITE_API_BASE"
          if [ -z "$basis" ]; then
            basis="$AUS_DEPLOY"
            quelle="Ausgabe des Worker-Deploys"
          fi
          if [ -z "$basis" ]; then
            echo "::warning::Keine Worker-Adresse ermittelt — die App läuft im lokalen Modus und teilt nichts."
            quelle="nichts gefunden"
          fi
          echo "base=$basis" >> "$GITHUB_OUTPUT"
          echo "quelle=$quelle" >> "$GITHUB_OUTPUT"
          echo "VITE_API_BASE=$basis (aus: $quelle)"

      # Frische Daten, aber der Deploy hängt nicht daran: Ein Behördendienst,
      # der heute schweigt, darf keine Auslieferung verhindern — der
      # eingecheckte Abzug ist gültige Daten, nur ältere. Was scheitert, steht
      # danach in der Zusammenfassung, statt still zu altern; genau das war
      # Audit-Punkt M-031 an der alten Fassung in `pages.yml`, wo ein
      # `continue-on-error` den Fehlschlag verschluckte.
      #
      # Kein `&&` über die ganze Kette: Ein gescheiterter Abruf soll die
      # nächste Stadt nicht mitreissen, und `if` sagt das deutlicher als eine
      # Kette, deren Abbruchverhalten man nachschlagen muss.
      - name: Daten auffrischen
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          gescheitert=""
          for stadt in berlin hamburg frankfurt muenchen; do
            skript="build-data"
            [ "$stadt" = "berlin" ] || skript="build-data-$stadt"
            if CITY="$stadt" pnpm --filter @knoellchenfrei/ingest fetch-data && CITY="$stadt" pnpm --filter @knoellchenfrei/ingest "$skript"; then
              echo "$stadt: frisch"
            else
              echo "$stadt: nicht aufgefrischt, der eingecheckte Abzug bleibt"
              gescheitert="$gescheitert $stadt"
            fi
          done
          if [ -n "$gescheitert" ]; then
            echo "### Daten nicht aufgefrischt:$gescheitert" >> "$GITHUB_STEP_SUMMARY"
            echo "Ausgeliefert wird der eingecheckte Abzug. Das ist kein Ausfall, aber es gehört gesehen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Web-App bauen
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        env:
          # Zur Buildzeit, nicht zur Laufzeit: ohne diesen Wert läuft die App im
          # lokalen Modus und teilt nichts.
          VITE_API_BASE: ${{ steps.api.outputs.base }}
          # Kein Secret, sondern eine Variable: Die Adresse des Kachelarchivs
          # ist öffentlich, sie steht in jedem Netzwerk-Request der App. Als
          # `vars` steht sie im Lauf-Protokoll und lässt sich nachlesen; als
          # Secret wäre sie maskiert und man suchte im Dunkeln.
          #
          # Ohne den Wert bleibt es bei den Rasterkacheln von OpenStreetMap,
          # und der Vektor-Teil liegt nicht einmal im Bündel.
          VITE_TILES_URL: ${{ vars.VITE_TILES_URL }}
        run: pnpm --filter @knoellchenfrei/web build

      # `--cwd` ist hier keine Kosmetik: `wrangler pages deploy` sucht das
      # Verzeichnis `functions/` relativ zum Arbeitsverzeichnis, und darin
      # liegt der Beta-Riegel (`_middleware.ts`). Ohne den Wechsel fände
      # wrangler es nicht, ausrollen würde trotzdem klappen — und die
      # geschlossene Beta stünde offen, ohne dass irgendwo ein roter Haken
      # erschiene. Der Pfad `dist` wird relativ zu `--cwd` aufgelöst.
      #
      # Warum `--cwd` und nicht `workingDirectory:` der Action: Die Action
      # installiert wrangler im Arbeitsverzeichnis und wählt das Werkzeug
      # anhand einer Sperrdatei. In `app/apps/web` liegt keine, also nimmt sie
      # npm — und npm bricht an `"@knoellchenfrei/core": "workspace:*"` ab:
      # `EUNSUPPORTEDPROTOCOL: Unsupported URL Type "workspace:"`. Gemessen am
      # 7. September, der Lauf ist daran gescheitert. Vom Wurzelverzeichnis aus
      # installiert sie weiter wie bisher.
      - name: Web-App ausrollen
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=knoellchenfrei --cwd app/apps/web

      - name: Zusammenfassung
        run: |
          if [ "${{ steps.gate.outputs.ready }}" = "true" ]; then
            {
              echo "### Ausgerollt"
              echo
              echo "- Worker: \`${{ steps.worker.outputs.deployment-url }}\`"
              echo "- Web-App spricht: \`${{ steps.api.outputs.base }}\` (aus: ${{ steps.api.outputs.quelle }})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Nicht ausgerollt — Zugangsdaten fehlen"
              echo
              echo "Unter *Settings → Secrets and variables → Actions* anlegen:"
              echo
              echo '- `CLOUDFLARE_API_TOKEN` — braucht genau zwei Rechte: *Workers Scripts:Edit* und *Cloudflare Pages:Edit*. Mehr nicht: Dieser Workflow rollt nur aus, angelegt wird lokal mit `scripts/einrichten.sh`.'
              echo '- `CLOUDFLARE_ACCOUNT_ID` — steht im Cloudflare-Dashboard rechts in der Seitenleiste'
              echo
              echo 'Beides setzt `./scripts/einrichten.sh ci` für dich, wenn `gh` angemeldet ist.'
              echo '- `VITE_API_BASE` — **optional**. Ohne das Secret nimmt der Deploy die Adresse, die der Worker-Deploy selbst ausgibt. Nur nötig, wenn der Worker hinter einer eigenen Domain liegt.'
              echo
              echo 'Details: [docs/hosting.md](docs/hosting.md)'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
