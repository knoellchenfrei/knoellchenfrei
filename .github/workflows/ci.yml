name: CI

on:
  push:
    # Ohne den Ausschluss laeuft die Suite bei jedem Dependabot-PR zweimal:
    # einmal fuer den Push auf den dependabot/-Branch, einmal fuer den PR
    # selbst. Bei rund neun Minuten E2E ist das keine Kleinigkeit.
    # Negativmuster IN der Liste, nicht als zweiter Schluessel: `branches` und
    # `branches-ignore` zusammen im selben Ereignis lehnt GitHub Actions ab.
    branches: ['**', '!dependabot/**']
  pull_request:

jobs:
  check:
    name: Typen, Tests, Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - name: Coverage (bricht unter den Schwellwerten ab)
        run: pnpm test:coverage
      - run: pnpm --filter @knoellchenfrei/web build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: app/packages/core/coverage/
          retention-days: 14

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knoellchenfrei/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knoellchenfrei/web exec playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: app/apps/web/test-results/
          retention-days: 14

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Bekannte Schwachstellen in Abhängigkeiten
        run: pnpm audit --audit-level moderate

      - name: Keine offensichtlichen Secrets im ausgelieferten Bundle
        run: |
          pnpm --filter @knoellchenfrei/web build
          if grep -rIiE '(api[_-]?key|secret|password|token)["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' apps/web/dist/assets/ ; then
            echo "::error::Mögliches Secret im Bundle gefunden"
            exit 1
          fi
          echo "Keine Treffer."
