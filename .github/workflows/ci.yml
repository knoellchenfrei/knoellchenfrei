name: CI

on:
  push:
    # Ohne den Ausschluss laeuft die Suite bei jedem Dependabot-PR zweimal:
    # einmal fuer den Push auf den dependabot/-Branch, einmal fuer den PR
    # selbst. Bei rund neun Minuten E2E ist das keine Kleinigkeit.
    # Negativmuster IN der Liste, nicht als zweiter Schluessel: `branches` und
    # `branches-ignore` zusammen im selben Ereignis lehnt GitHub Actions ab.
    branches: ['**', '!dependabot/**']
  pull_request:

# Ohne diesen Block bekommt `GITHUB_TOKEN` die Voreinstellung des Repositories
# — und die ist einstellbar, steht also nicht hier, sondern irgendwo im
# Dashboard. Dieser Workflow prueft nur; er braucht Lesen und sonst nichts.
# Die drei uebrigen Workflows hatten den Block seit jeher (Audit-Punkt M-044).
permissions:
  contents: read

jobs:
  check:
    name: Typen, Tests, Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - name: Coverage (bricht unter den Schwellwerten ab)
        run: pnpm test:coverage
      - run: pnpm --filter @knoellchenfrei/web build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: app/packages/core/coverage/
          retention-days: 14

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knoellchenfrei/web exec playwright install --with-deps chromium
      - run: pnpm --filter @knoellchenfrei/web exec playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: app/apps/web/test-results/
          retention-days: 14

  # Die Skripte richten Produktivsysteme ein und sichern die Datenbank — sie
  # sind kein Beiwerk. shellcheck fand beim ersten Lauf 15 Hinweise, darunter
  # 13× `A && B || C`: Das ist kein if-then-else, C laeuft auch, wenn A wahr
  # war und B scheiterte. Genau diese Sorte Kette hat in diesem Projekt schon
  # einmal einen Commit rausgehen lassen, der nichts geaendert hatte
  # (Audit-Punkt M-036).
  shell:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh app/packages/ingest/scripts/*.sh
      # Eine Umbenennung muss alle Stellen treffen. Die Namen stehen in vier
      # Sprachen; diese Pruefung sagt es laut, wenn zwei auseinanderlaufen.
      - name: Namen der Ressourcen stimmen ueberein
        run: ./scripts/namen-pruefen.sh

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Bekannte Schwachstellen in Abhängigkeiten
        run: pnpm audit --audit-level moderate

      - name: Keine offensichtlichen Secrets im ausgelieferten Bundle
        run: |
          pnpm --filter @knoellchenfrei/web build
          if grep -rIiE '(api[_-]?key|secret|password|token)["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' apps/web/dist/assets/ ; then
            echo "::error::Mögliches Secret im Bundle gefunden"
            exit 1
          fi
          echo "Keine Treffer."
